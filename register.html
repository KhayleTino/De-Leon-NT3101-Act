<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Leon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #ffffff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        .register-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(12px);
            transition: transform 0.45s ease;
        }

        .register-card.is-visible {
            transform: translateY(0);
        }

        .register-header {
            margin-bottom: 1.8rem;
            text-align: center;
        }

        .register-header .icon {
            display: inline-block;
            margin-bottom: 0.4rem;
            padding: 0.6rem 1rem;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            font-size: 2.5rem;
        }

        .register-header h1 {
            margin-top: 0.6rem;
            font-size: 2rem;
        }

        .register-header p {
            margin-top: 0.25rem;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            padding-left: 0.25rem;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            font: inherit;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-group input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 4.5rem;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 0.9rem;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #c4b5fd;
            cursor: pointer;
            font: inherit;
            font-size: 0.85rem;
        }

        .btn-register {
            margin-top: 0.3rem;
            padding: 0.9rem;
            border: 0;
            border-radius: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.25);
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
        }

        .btn-register:disabled {
            cursor: wait;
            opacity: 0.75;
        }

        .form-status {
            color: #c4b5fd;
            font-size: 0.9rem;
            text-align: center;
        }

        .form-status.is-error,
        .field-error {
            color: #ffb4ab;
        }

        .form-status.is-success {
            color: #a7f3d0;
        }

        .form-group input.is-invalid {
            border-color: #ffb4ab;
        }

        .signin-link {
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
            text-align: center;
        }

        .signin-link a {
            color: #c4b5fd;
            font-weight: 600;
            text-decoration: none;
        }

        footer {
            width: 100%;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 2rem 1.5rem;
            }

            .register-header h1 {
                font-size: 1.6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="register-card">
        <header class="register-header">
            <span class="icon" aria-hidden="true">✨</span>
            <h1>Create account</h1>
            <p>Set up your personal space</p>
        </header>

        <form class="register-form" action="login.html" method="get">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" required />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required />
                    <button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Enter your password again" autocomplete="new-password" required />
                    <button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-register">Create Account</button>
            <p class="form-status" role="status" aria-live="polite" hidden></p>
        </form>

        <p class="signin-link">
            Already have an account? <a href="login.html">Sign in</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 de Leon. Some rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
    <script>
        $(function () {
            $(".register-card")
                .animate({ opacity: 1 }, 500)
                .queue(function (next) {
                    $(this).addClass("is-visible");
                    next();
                });

            $(".toggle-password").on("click", function () {
                const passwordInput = $(this).siblings("input");
                const shouldShow = passwordInput.attr("type") === "password";

                passwordInput.attr("type", shouldShow ? "text" : "password");
                $(this)
                    .text(shouldShow ? "Hide" : "Show")
                    .attr("aria-label", shouldShow ? "Hide password" : "Show password")
                    .attr("aria-pressed", shouldShow);
            });

            $(".register-form").validate({
                errorElement: "span",
                errorClass: "field-error",
                rules: {
                    username: { 
                        required: true, 
                        minlength: 2, 
                        maxlength: 50
                    },
                    email: { 
                        required: true, 
                        email: true 
                    },
                    password: { 
                        required:true, 
                        minlength:6, 
                        maxlength:50, 
                        specialChars:true, 
                        number:true 
                    },
                    "confirm-password": { required: true, equalTo: "#password" }
                },
                messages: {
                    username: {
                        required: "Enter your username.",
                        minlength: "Your username must be at least 2 characters."
                    },
                    email: {
                        required: "Enter your email address.",
                        email: "Enter a valid email address."
                    },
                    password: {
                        required: "Create a password.",
                        minlength: "Your password must be at least 6 characters.",
                        maxlength: "Your password cannot exceed 50 characters.",
                        specialChars: "Your password must contain at least one special character.",
                        number: "Your password must contain at least one number."
                    },
                    "confirm-password": {
                        required: "Enter your password again.",
                        equalTo: "The passwords do not match."
                    }
                },
                errorPlacement: function (error, element) {
                    if (element.closest(".password-field").length) {
                        error.insertAfter(element.closest(".password-field"));
                    } else {
                        error.insertAfter(element);
                    }
                },
                highlight: function (element) {
                    $(element).addClass("is-invalid");
                },
                unhighlight: function (element) {
                    $(element).removeClass("is-invalid");
                },
                submitHandler: function (form) {
                    const status = $(form).find(".form-status");

                    status
                        .removeClass("is-error")
                        .addClass("is-success")
                        .text("Details validated. This demo uses the login admin / 12345.")
                        .prop("hidden", false);
                    $(form).find(".btn-register").prop("disabled", true).text("Details validated");

                    window.setTimeout(function () {
                        window.location.href = form.action;
                    }, 1200);
                    return false;
                }
            });
        });
    </script>
</body>
</html>
