<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Leon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #ffffff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 2.8rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(12px);
            transition: transform 0.45s ease;
        }

        .login-card.is-visible {
            transform: translateY(0);
        }

        .login-header {
            margin-bottom: 2.2rem;
            text-align: center;
        }

        .login-header .icon {
            display: inline-block;
            margin-bottom: 0.4rem;
            padding: 0.6rem 1rem;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            font-size: 3rem;
        }

        .login-header h1 {
            margin-top: 0.6rem;
            font-size: 2rem;
        }

        .login-header p {
            margin-top: 0.25rem;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            padding-left: 0.25rem;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            font: inherit;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-group input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 4.5rem;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 0.9rem;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #c4b5fd;
            cursor: pointer;
            font: inherit;
            font-size: 0.85rem;
        }

        .form-extra {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.9rem;
        }

        .form-extra input {
            width: 1rem;
            height: 1rem;
            accent-color: #a78bfa;
        }

        .btn-login {
            margin-top: 0.3rem;
            padding: 0.9rem;
            border: 0;
            border-radius: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.25);
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            cursor: wait;
            opacity: 0.75;
        }

        .form-status {
            color: #c4b5fd;
            font-size: 0.9rem;
            text-align: center;
        }

        .form-status.is-error,
        .field-error {
            color: #ffb4ab;
        }

        .form-status.is-success {
            color: #a7f3d0;
        }

        .form-group input.is-invalid {
            border-color: #ffb4ab;
        }

        .signup-link {
            margin-top: 1.8rem;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
            text-align: center;
        }

        .signup-link a {
            color: #c4b5fd;
            font-weight: 600;
            text-decoration: none;
        }

        footer {
            width: 100%;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <header class="login-header">
            <span class="icon" aria-hidden="true">🔐</span>
            <h1>Welcome!</h1>
            <p>Sign in to your account</p>
        </header>

        <form class="login-form" action="landing.html" method="get">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Your username" autocomplete="username" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required />
                    <button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
            </div>

            <label class="form-extra">
                <input type="checkbox" name="remember" checked />
                Remember me
            </label>

            <button type="submit" class="btn-login">Sign In</button>
            <p class="form-status" role="status" aria-live="polite" hidden></p>
        </form>

        <p class="signup-link">
            Need an account? <a href="register.html">Create one</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 de Leon. Some rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
    <script>
        $(function () {
            $(".login-card")
                .animate({ opacity: 1 }, 500)
                .queue(function (next) {
                    $(this).addClass("is-visible");
                    next();
                });

            $(".toggle-password").on("click", function () {
                const passwordInput = $("#password");
                const shouldShow = passwordInput.attr("type") === "password";

                passwordInput.attr("type", shouldShow ? "text" : "password");
                $(this)
                    .text(shouldShow ? "Hide" : "Show")
                    .attr("aria-label", shouldShow ? "Hide password" : "Show password")
                    .attr("aria-pressed", shouldShow);
            });

            $(".login-form").validate({
                errorElement: "span",
                errorClass: "field-error",
                rules: {
                    username: { required: true, minlength: 2 },
                    password: { required: true }
                },
                messages: {
                    username: {
                        required: "Enter your username.",
                        minlength: "Username must be at least 2 characters."
                    },
                    password: { required: "Enter your password." }
                },
                errorPlacement: function (error, element) {
                    if (element.closest(".password-field").length) {
                        error.insertAfter(element.closest(".password-field"));
                    } else {
                        error.insertAfter(element);
                    }
                },
                highlight: function (element) {
                    $(element).addClass("is-invalid");
                },
                unhighlight: function (element) {
                    $(element).removeClass("is-invalid");
                },
                submitHandler: function (form) {
                    const username = $(form).find("#username").val().trim();
                    const status = $(form).find(".form-status");

                    try {
                        sessionStorage.setItem("leonAuthenticated", "true");
                        sessionStorage.setItem("leonUsername", username);
                    } catch (error) {
                        status
                            .removeClass("is-success")
                            .addClass("is-error")
                            .text("Sign-in could not be saved in this browser. Enable session storage and try again.")
                            .prop("hidden", false);
                        return false;
                    }

                    status
                        .removeClass("is-error")
                        .addClass("is-success")
                        .text("Sign in successful. Opening your space...")
                        .prop("hidden", false);
                    $(form).find(".btn-login").prop("disabled", true).text("Signing in...");

                    window.setTimeout(function () {
                        window.location.href = form.action;
                    }, 600);
                    return false;
                }
            });
        });
    </script>
</body>
</html>
